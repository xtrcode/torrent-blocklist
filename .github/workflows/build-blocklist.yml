name: Build blocklist

on:
  schedule:
    # daily at 04:17 UTC (upstream lists change at most daily; unchanged output is not committed)
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - "phpstan.neon.dist"
      - ".php-cs-fixer.dist.php"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "blocklist.env"
      - ".github/workflows/build-blocklist.yml"
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - "phpstan.neon.dist"
      - ".php-cs-fixer.dist.php"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "blocklist.env"
      - ".github/workflows/build-blocklist.yml"

# no token permissions by default; only the build job gets what it needs
permissions: {}

# never let two builds commit at the same time
concurrency:
  group: build-blocklist
  cancel-in-progress: false

jobs:
  check:
    name: Coding style, static analysis and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build CI image (dev dependencies baked in)
        run: docker build --pull --target ci -t torrent-blocklist:ci .

      - name: Run composer check
        run: docker run --rm torrent-blocklist:ci composer check

  build:
    name: Generate and commit blocklist files
    needs: check
    # pull requests only run the checks; they never get a token with write access
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: docker build --target runtime -t torrent-blocklist:runtime .

      - name: Restore download cache (ipdeny.com zones, source lists)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          # a new key per run so the freshest cache is always saved; restore falls back to the latest one
          key: blocklist-cache-${{ github.run_id }}
          restore-keys: |
            blocklist-cache-

      - name: Generate blocklist files
        run: |
          mkdir -p cache dist
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env-file blocklist.env \
            -v "$PWD/cache:/cache" \
            -v "$PWD/dist:/output" \
            torrent-blocklist:runtime

      - name: Show result
        run: |
          ls -la dist
          cat dist/*.json 2>/dev/null || true

      - name: Commit and push generated files
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "Blocklist unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update blocklist ($(date -u +%Y-%m-%d))"
          # in case main moved while the build was running
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
